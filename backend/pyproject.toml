[project]
name = "dex"
version = "0.1.0"
description = "Fast read-only explorer for Postgres (direct or through the Supabase Management API)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Adrian Lavergne" }]
requires-python = ">=3.12"
keywords = ["postgres", "postgresql", "supabase", "neovim", "database", "cli", "sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "psycopg[binary]==3.2.10",
    "sqlglot==30.23.0",
]

[project.urls]
Homepage = "https://github.com/latentspacetime/dex"
Repository = "https://github.com/latentspacetime/dex"
Issues = "https://github.com/latentspacetime/dex/issues"

[project.scripts]
dex = "dex.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dex"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
